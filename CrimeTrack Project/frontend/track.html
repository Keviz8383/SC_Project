<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Dossier | CrimeTrack</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .track-layout {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }
        
        .dossier-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2rem;
        }

        .timeline-vertical {
            position: relative;
            padding-left: 3rem;
            margin-top: 3rem;
        }

        .timeline-vertical::before {
            content: '';
            position: absolute;
            left: 7.5px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--teal-primary), var(--border-color));
        }

        .timeline-item-v {
            position: relative;
            padding-bottom: 3rem;
        }

        .timeline-item-v::after {
            content: '';
            position: absolute;
            left: -30.5px;
            top: 5px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--bg-dark);
            border: 3px solid var(--teal-primary);
            box-shadow: 0 0 10px var(--teal-glow);
            z-index: 2;
        }

        .evidence-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .evidence-item {
            width: 100%;
            height: 150px;
            border-radius: 1rem;
            object-fit: cover;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            cursor: pointer;
        }

        .evidence-item:hover {
            transform: scale(1.05);
            border-color: var(--teal-primary);
        }

        #lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Accessibility Bar -->
    <div class="gov-top-bar">
        <div class="gov-indicator">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" alt="Emblem of India">
            <span>Government of India &bull; Intelligence Command</span>
        </div>
        <div class="accessibility-tools">
            <a href="index.html" class="a-tool">Home</a>
            <span class="a-tool" onclick="setFontSize('small')">A-</span>
            <span class="a-tool" onclick="setFontSize('normal')">A</span>
            <span class="a-tool" onclick="setFontSize('large')">A+</span>
        </div>
    </div>

    <div class="track-layout animate-up">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4rem;">
            <div class="logo" style="cursor: pointer;" onclick="history.back()">
                <div style="background: hsla(var(--teal-h), var(--teal-s), var(--teal-l), 0.1); padding: 0.8rem; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color);">
                    <i class="fa-solid fa-arrow-left" style="font-size: 1.2rem; color: var(--teal-primary);"></i>
                </div>
                <div>
                    <h2 style="font-weight: 800; font-size: 1.8rem; letter-spacing: -1px;">Operation Dossier</h2>
                </div>
            </div>
            <div id="complaint-id-pill" class="status-badge" style="background: hsla(var(--teal-h), var(--teal-s), var(--teal-l), 0.05); color: var(--teal-primary); border-color: hsla(var(--teal-h), var(--teal-s), var(--teal-l), 0.3); padding: 0.8rem 1.5rem; font-family: 'Outfit'; letter-spacing: 2px; font-weight: 800;">
                SEC-SCANNING...
            </div>
        </header>

        <div class="glass-card" style="padding: 4rem;">
            <div class="dossier-header" style="border-bottom: 1px solid var(--border-color); padding-bottom: 2.5rem; margin-bottom: 3.5rem;">
                <div>
                    <span id="view-category" class="status-badge" style="background: hsla(200, 100%, 50%, 0.1); color: #38bdf8; margin-bottom: 1rem; display: inline-block;">Priority Intelligence</span>
                    <h1 id="view-title" style="font-size: 3.5rem; line-height: 1; margin-bottom: 0.5rem; letter-spacing: -2px;">Loading Dossier...</h1>
                </div>
                <div id="view-status-badge" class="status-badge" style="font-size: 0.8rem; padding: 0.8rem 1.8rem;">Status Pending</div>
            </div>

            <div style="background: hsla(222, 47%, 2%, 0.3); border: 1px solid var(--border-color); padding: 2.5rem; border-radius: 1.5rem; margin-bottom: 5rem; position: relative; overflow: hidden;">
                 <div style="position: absolute; top: -10px; right: -10px; font-size: 10rem; opacity: 0.02; transform: rotate(15deg); color: var(--teal-primary);">
                    <i class="fa-solid fa-quote-right"></i>
                 </div>
                <h4 style="color: var(--teal-primary); margin-bottom: 1.2rem; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; font-weight: 800;">Detailed Intelligence Brief</h4>
                <p id="view-desc" style="color: var(--text-muted); line-height: 1.9; font-size: 1.1rem;"></p>
            </div>

            <div style="margin-bottom: 5rem;">
                <h3 style="color: var(--teal-primary); display: flex; align-items: center; gap: 1rem; margin-bottom: 2.5rem; font-size: 1.5rem;">
                    <i class="fa-solid fa-photo-film"></i> Photographic Evidence Assets
                </h3>
                <div id="evidence-container" class="evidence-grid">
                    <!-- Injected evidence -->
                </div>
            </div>

            <div>
                <h3 style="color: var(--teal-primary); display: flex; align-items: center; gap: 1rem; margin-bottom: 3rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; font-size: 1.5rem;">
                    <i class="fa-solid fa-clock-rotate-left"></i> Procedural Log Timeline
                </h3>
                <div id="timeline-container" class="timeline-vertical">
                    <!-- Injected timeline -->
                </div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 5rem;">
            <button class="btn btn-primary" onclick="downloadDossier()" style="padding: 1.2rem 3rem;">
                <i class="fa-solid fa-file-pdf"></i> Generate Official Classified Dossier
            </button>
            <p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">Unauthorized distribution of this dossier is a federal offense.</p>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" style="max-width: 90%; max-height: 90%; border-radius: 1rem; border: 2px solid var(--teal-primary); box-shadow: 0 0 50px rgba(0,0,0,0.8);">
    </div>

    <script src="assets/js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const complaintId = urlParams.get('id');
            if (complaintId) loadComplaintDetails(complaintId);
            else window.location.href = 'citizen.html';
        });

        async function loadComplaintDetails(id) {
            utils.showLoader();
            try {
                const data = await utils.apiFetch(`/complaints/${id}`);
                const c = data.complaint;
                
                document.getElementById('complaint-id-pill').innerText = 'DSR // ' + c.id;
                document.getElementById('view-title').innerText = c.title;
                document.getElementById('view-category').innerText = c.category;
                document.getElementById('view-desc').innerText = c.description;

                const statusBadge = document.getElementById('view-status-badge');
                statusBadge.innerText = c.status;
                statusBadge.className = `status-badge status-${c.status.toLowerCase().replace(/\s+/g, '')}`;

                // Evidence
                const evidenceList = document.getElementById('evidence-container');
                if (data.evidence && data.evidence.length > 0) {
                    evidenceList.innerHTML = '';
                    data.evidence.forEach(ev => {
                        const img = document.createElement('img');
                        img.className = 'evidence-item';
                        img.src = ev.file_url;
                        img.alt = ev.file_name;
                        img.onclick = (e) => {
                            e.stopPropagation();
                            document.getElementById('lightbox-img').src = ev.file_url;
                            document.getElementById('lightbox').style.display = 'flex';
                        };
                        evidenceList.appendChild(img);
                    });
                } else {
                    evidenceList.innerHTML = '<p style="color: var(--text-muted); border: 1px dashed var(--border-color); padding: 2rem; border-radius: 1.5rem; text-align: center; grid-column: 1 / -1;">No intelligence media attached.</p>';
                }

                // Timeline
                const timeline = document.getElementById('timeline-container');
                timeline.innerHTML = '';
                if (data.history && data.history.length > 0) {
                    data.history.forEach((event, index) => {
                        const div = document.createElement('div');
                        div.className = 'timeline-item-v animate-up';
                        div.style.animationDelay = `${(index + 1) * 0.15}s`;
                        div.innerHTML = `
                            <div style="font-size: 0.75rem; color: var(--teal-primary); margin-bottom: 0.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">
                                ${new Date(event.updated_at).toLocaleString()}
                            </div>
                            <h4 style="margin-bottom: 0.5rem; font-size: 1.2rem;">${event.status}</h4>
                            <p style="font-size: 0.95rem; color: var(--text-muted); line-height: 1.6;">${event.remarks || 'Automated status migration recorded.'}</p>
                        `;
                        timeline.appendChild(div);
                    });
                } else {
                    timeline.innerHTML = '<p style="color: var(--text-muted);">No historical trail identified.</p>';
                }
            } catch (err) {
                alert('Dossier Access Failed: Intelligence connection error.');
            } finally {
                utils.hideLoader();
            }
        }

        function downloadDossier() {
            utils.showLoader();
            setTimeout(() => {
                utils.hideLoader();
                alert('Official Dossier (PDF) has been encrypted and prepared for transmission.');
            }, 1200);
        }

        function setFontSize(size) {
            if (size === 'small') document.documentElement.style.fontSize = '14px';
            if (size === 'normal') document.documentElement.style.fontSize = '16px';
            if (size === 'large') document.documentElement.style.fontSize = '18px';
        }
    </script>
</body>
</html>
